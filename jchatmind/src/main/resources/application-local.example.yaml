# Copy this file to application-local.yaml and fill local-only secrets.
# application-local.yaml is ignored by git.
spring:
  datasource:
    password: your-local-postgres-password
  mail:
    password: your-mail-authorization-code
  ai:
    deepseek:
      api-key: your-deepseek-api-key
    zhipuai:
      api-key: your-zhipuai-api-key

jchatmind:
  search:
    tavily:
      enabled: true
      api-key: your-tavily-api-key
