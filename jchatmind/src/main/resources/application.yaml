spring:
  config:
    # 鏈満鍙斁缃?application-local.yaml锛堝凡鍔犲叆 .gitignore锛夛紝閬垮厤鎶?Tavily 绛夊瘑閽ユ彁浜ゅ埌 Git锛汣I/鏃犳鏂囦欢鏃惰嚜鍔ㄥ拷鐣?
    import: optional:classpath:application-local.yaml
  application:
    name: jchatmind
  servlet:
    multipart:
      # 论文元数据 CSV（~13MB）与后续论文全文批量导入需要更大上限
      max-file-size: 200MB
      max-request-size: 1000MB
  datasource:
    url: jdbc:postgresql://localhost:5432/jchatmind
    username: postgres
    password: ${JCHATMIND_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.qq.com
    port: 587
    username: 1255354811@qq.com
    password: ${JCHATMIND_MAIL_PASSWORD:} # mail authorization code
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6
mybatis:
  type-aliases-package: com.kama.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jchatmind.typehandler

document:
  storage:
    base-path: ./data/documents

jchatmind:
  context-management:
    enabled: true
    tool-result-max-chars: 8000
    tool-result-head-chars: 3500
    tool-result-tail-chars: 3500
    summary-trigger-messages: 16
    summary-keep-recent-messages: 8
    max-prompt-chars: 60000
  skill:
    enabled: true
    scan-directories:
      - ./skills
    type: OPTIONAL
  rag:
    hybrid:
      enabled: true
      vector-top-k: 20
      bm25-top-k: 20
      final-top-n: 3
      rrf-k: 60
      warmup-on-startup: false
      max-top-n: 100          # 瀛?Agent 瀹藉彫鍥?topN 纭笂闄愶紝闃叉杩囧害鎷夊彇
      bm25:
        k1: 1.2
        b: 0.75
  # ---- Agentic Search锛圥R1 鍗犱綅锛宔nabled=false 涓嶅奖鍝嶇幇鏈夊姛鑳斤級----
  agentic-search:
    enabled: true
    router:
      enabled: true
      model: deepseek    # 鎰忓浘璺敱浣跨敤鐨勬ā鍨嬶紝寤鸿闈?reasoning 蹇€熸ā鍨?
      timeout-ms: 3000
    delegation:
      max-parallel: 4         # 鍗曟濮旀淳鏈€澶у苟鍙戝瓙浠诲姟鏁?
      max-sub-steps-cap: 8    # 瀛?Agent MAX_STEPS 纭笂闄?
      default-timeout-seconds: 45
      global-timeout-seconds: 60
      per-user-max-parallel: 6
      max-sub-agent-redelegations: 1   # 鍗曚釜瀛愪换鍔￠娆?runSubAgent 澶辫触鍚庯紝hook 鍏佽鍐嶆墽琛岀殑娆℃暟涓婇檺
    sub-agent:
      kb-wide-top-k: 30       # SubAgentKnowledgeTool 榛樿 topK
      kb-wide-top-k-max: 60
    search:
      default-count: 8
      count-max: 15
  # ---- Tavily Search Provider锛涘瘑閽ヤ紭鍏?TAVILY_API_KEY 鎴?application-local.yaml ----
  search:
    tavily:
      enabled: true
      api-key: ${TAVILY_API_KEY:}
      base-url: https://api.tavily.com
      search-depth: basic     # basic | advanced
      default-count: 8
      timeout-ms: 8000
      max-retries: 2
