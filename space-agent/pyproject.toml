[project]
name = "space-agent"
version = "0.1.0"
description = "FastAPI migration skeleton for the JChatMind backend contract."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a configured PostgreSQL database",
]
testpaths = ["tests"]

[tool.uvicorn]
factory = false
